<!doctype html>
<!--
  Source for public/og.png — the 1200x630 card that appears when the site is
  shared on Discord, X, Kick or anywhere else that reads Open Graph.

  Kept as HTML rather than drawn in code so it uses the site's real typeface and
  can be re-rendered by screenshotting this file at 1200x630. See the README.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        background: #080e16;
        font-family: 'DM Sans', system-ui, sans-serif;
        color: #f2f6fa;
      }

      .bg {
        position: absolute;
        inset: 0;
        background: url('../public/lodge.webp') center 42% / cover no-repeat;
      }

      /* Same vignette discipline as the site: darken the margins so the copy
         always has a quiet field behind it. */
      .veil {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(7, 12, 20, 0.96) 34%, rgba(7, 12, 20, 0.55) 62%, rgba(7, 12, 20, 0.8) 100%),
          radial-gradient(120% 80% at 50% 40%, transparent 30%, rgba(7, 12, 20, 0.8) 100%);
      }

      .texture {
        position: absolute;
        inset: 0;
        opacity: 0.16;
        background: url('../public/texture.webp') center / cover no-repeat;
      }

      .copy {
        position: relative;
        z-index: 2;
        padding: 0 64px;
        width: 700px;
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 16px;
        border: 1px solid #2a3c52;
        border-radius: 999px;
        background: rgba(14, 22, 34, 0.8);
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #93a7bd;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #e31b45; }

      h1 {
        margin-top: 26px;
        font-size: 92px;
        font-weight: 700;
        line-height: 0.92;
        letter-spacing: -0.035em;
        text-transform: uppercase;
      }

      p {
        margin-top: 22px;
        font-size: 25px;
        line-height: 1.4;
        color: #93a7bd;
        max-width: 20ch;
      }
      p b { color: #f2f6fa; font-weight: 700; }

      .pill {
        margin-top: 30px;
        display: inline-block;
        padding: 12px 22px;
        border-radius: 14px;
        background: #e31b45;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.34), 0 5px 0 #8d0f2c;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 700;
        color: #fff;
      }

      .mascot {
        position: absolute;
        right: 22px;
        bottom: -30px;
        z-index: 2;
        height: 600px;
        filter: drop-shadow(0 24px 50px rgba(0, 0, 0, 0.75));
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="veil"></div>
    <div class="texture"></div>

    <div class="copy">
      <span class="kicker"><span class="dot"></span> Roobet &amp; Lootbox partner</span>
      <h1>Misfit<br />Mason</h1>
      <p><b>$450</b> in monthly prizes, and 100% of affiliate revenue returned.</p>
      <span class="pill">kickmisfitmason</span>
    </div>

    <img class="mascot" src="../public/mascot.png" alt="" />
  </body>
</html>
